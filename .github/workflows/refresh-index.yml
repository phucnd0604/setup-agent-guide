name: Refresh plugin index

on:
  schedule:
    - cron: "17 3 * * *" # hằng ngày 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-index
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild index from manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build-dsh-plugin-index.mjs --manifest dsh-plugins.json --out dsh-plugins-index.json

      - name: Commit when the index changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dsh-plugins-index.json
          git commit -m "Refresh plugin index"
          git push
